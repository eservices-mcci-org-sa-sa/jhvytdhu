<style>
    canvas, .canvas-container {
        -webkit-box-shadow: 0px 0px 10px 0px rgba(39, 39, 39, 0.25);
        -moz-box-shadow: 0px 0px 10px 0px rgba(39, 39, 39, 0.25);
        box-shadow: 0px 0px 5px 0px rgba(39, 39, 39, 0.25);
        margin: auto !important;
    }
</style>
<div class="new-req dashboard-content p-bottom-lg">
    <div class="embed-responsive">
        <div class="container">
            <div class="new-req-content">
                <form class="form-horizontal text-right" id="requestForm" name="requestForm" autocomplete="off">
                    <div class="form-body row  row-model">
                        <fieldset>
                            <div class="row" ng-show="page.thereIsData">
                                <h1></h1>
                                <div class="container">
                                    <div class="nreq-wizard">
                                        <div class="sp-main-box margin-bottom-20">
                                            <ul class="list-unstyled flex-row" style="justify-content:center">
                                                <li class="col-md-2 col-lg-2 col-sm-2 col-xs-12" ng-repeat="step in steps" ng-class="{'active':step.step == page.currentStep, 'done': step.step < page.currentStep}">
                                                    <div class="nreq-wizard-item sp-item-wizard">
                                                        <div class="img-holder">
                                                            <img ng-src="{{step.imgUrl}}" />
                                                        </div>
                                                        <h3>{{step.step   | ngArabicNumber: true}}. {{step.name}}</h3>
                                                    </div>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>

                                    <div id="wizard-content-container" class="w3-animate-bottom" ng-cloak ng-show="page.wizardData">
                                        <ng-include src="templateUrl()"></ng-include>
                                    </div>
                                    <div ng-hide="page.wizardData" style="margin-right:80px;margin-left:80px;">
                                        <div ng-show="page.showWizardLoad" class="text-center" data-loading>
                                            <img src="../../../Content/Theme/dist/img/ajax-loader.gif" style="width: 80px;">
                                        </div>
                                        <div class="col-md-12" ng-show="page.wizardData">
                                            <div class="note note-danger" style="text-align:center !important">
                                                عفواً . لا توجـد بيانات.
                                            </div>
                                        </div>
                                    </div>

                                    <div class="clearfix"></div>
                                    <div class="sp-main-box" ng-if="page.currentStep != 1">
                                        <div id="wizard-navigation-container">
                                            <div class="text-center">
                                                <span>
                                                    <button ng-disabled="page.currentStep <= 1" class="sp-main-button sp-transparent-button" ng-hide="page.currentStep==1 || rtab == 2 ||
                                                        (RequestModel.requestType=== 28 && contestTab === 2)  || (RequestModel.requestType=== 28 &&  contestTab === 3 && page.currentStep === 2)
                                                        || (page.currentStep == 2 && rtab == 3)"
                                                            name="previous" style="margin-left: 10px;" type="button" ng-click="gotoStep(page.currentStep - 1,requestForm,$event,GridsArray)">
                                                        <i class="fa fa-arrow-right"></i> الخطوة السابقة
                                                    </button>
                                                    <button ng-hide="page.currentStep===3 || page.currentStep===1 || rtab == 2 || rtab == 1 || (RequestModel.requestType === 1 && UpdateRequestStep1 === true)
                                                      ||  (RequestModel.requestType=== 28 && (contestTab === 2 || contestTab === 1))"
                                                            class="sp-main-button" name="next" type="button" ng-click="gotoStep(page.currentStep + 1,requestForm,$event,GridsArray)">
                                                        التالى <i class="fa fa-arrow-left"></i>
                                                    </button>
                                                </span>
                                                <button ng-disabled="page.currentStep != steps.length || saveRequestStart ==true" ng-if="page.currentStep==3" class="sp-main-button"
                                                        name="next" type="button" ng-click="save()">
                                                    <i class="fa fa-floppy-o"></i> اعتماد الطلب
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div ng-hide="page.thereIsData" class="m-top-sm">
                                <div ng-show="page.showLoad" class="text-center" data-loading>
                                    <img src="../../../Content/Theme/dist/img/ajax-loader.gif" style="width: 80px;">
                                </div>
                            </div>
                        </fieldset>
                    </div>
                    <!--<ul>
                        <li ng-repeat="(key, errors) in requestForm.$error track by $index">
                            <strong>{{ key }}</strong> errors
                            <ul>
                                <li ng-repeat="e in errors">{{ e.$name }} has an error: <strong>{{ key }}</strong>.</li>
                            </ul>
                        </li>
                    </ul>-->
                    <!--<ul>
                        <li ng-repeat="(key, errors) in requestForm.benefitForm.$error track by $index">
                            <strong>{{ key }}</strong> errors
                            <ul>
                                <li ng-repeat="e in errors">
                                    {{ e.$name }} has an error: <strong>{{ key }}</strong>.
                                </li>
                            </ul>
                        </li>
                    </ul>-->
                </form>
            </div>
        </div>
    </div>
</div>
<!-- Modal -->

<modal class="sp-main-modal" title=" لإعتماد الطلب يرجي إدخال الكود المرسل لجوالك " visible="sms.codeSent">
    <form class="form-horizontal text-right" id="verifyForm" name="verifyForm" novalidate="novalidate">
        <div class="form-body row text-center">
            <div class="sp-main-form sp-main-form-inner" ng-show="sms.codeSent">
                <label> أدخل كود التحقق الذي تم إرساله على الهاتف الجوال الخاص بك </label>
                <div class="custom-input check-input-icon">
                    <input ng-required="true" ng-disabled="showSpin" restrict-input="{type: 'digitsOnly'}" ng-pattern="/^\d{4,6}$/" class="form-control"
                           autocomplete="off" maxlength="6" prevent-typing-greater
                           ng-model="sms.codeToMatch" name="codeToMatch" type="text">
                    <!--<ion-icon name="checkmark-circle-outline"></ion-icon>-->
                </div>
                <div ng-show="!sms.codeSent" class="text-center" data-loading>
                    <img src="../../../Content/Theme/dist/img/ajax-loader.gif" style="width: 80px;">
                </div>
                <div class="sp-countdown" ng-show="page.showSmsTime || page.smsTimer != 0">
                    <span>يمكنك إعادة الإرسال بعد {{page.smsTimer}} ثانية <a href="#" ng-click="sendCode();" ng-class="{'disabledAnchor':page.showSmsTime > 0 || page.showSmsTime}" ng-disabled="page.showSmsTime > 0 || page.showSmsTime">إعادة الإرسال</a></span>
                </div>

                <div ng-messages="verifyForm.codeToMatch.$error" ng-if="verifyForm.$submitted || verifyForm.codeToMatch.$touched">
                    <p class="text-danger" ng-message="required">من فضلك ادخل رقم الكود</p>
                    <p class="text-danger" ng-message="pattern"> فضلا ادخل رقم صحيح</p>
                </div>
            </div>

            <button class="sp-main-button lg-padding" ng-click="sms.codeSent = false;page.smsTimer = 240;page.showSmsTime = false;">
                إغلاق
            </button>
        </div>
    </form>
</modal>
